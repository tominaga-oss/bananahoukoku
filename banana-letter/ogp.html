<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* 携帯幅のアスペクト比：1080 x 1920（9:16） */
  html, body{ margin:0; padding:0; width:1080px; height:1920px; overflow:hidden; }
  body{
    font-family:"Klee One", "Noto Sans CJK JP", sans-serif;
    background: radial-gradient(115% 95% at 50% -10%, #fffdf8 0%, #f6eee1 40%, #eadcc6 78%, #e0d0b6 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    position:relative;
    width:900px; height:1500px;
    background:#fdfaf3;
    box-shadow: 0 0 0 1px rgba(122,108,88,0.14), 0 30px 70px -30px rgba(84,66,46,0.4);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 0 76px;
  }
  .card::before{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 84px, rgba(120,108,92,0.20) 84px, rgba(120,108,92,0.20) 85px);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 62%, rgba(0,0,0,0.32) 84%, rgba(0,0,0,0) 99%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 62%, rgba(0,0,0,0.32) 84%, rgba(0,0,0,0) 99%);
  }
  .card::after{
    content:""; position:absolute; top:0; bottom:0; left:54px; width:1px; background:rgba(176,84,70,0.30);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 64%, rgba(0,0,0,0) 98%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 64%, rgba(0,0,0,0) 98%);
  }
  .orn{ width:160px; margin:0 auto 68px; color:rgba(150,128,100,0.6); }
  .orn svg{ display:block; width:100%; }
  .inner{ position:relative; text-align:center; width:100%; }
  .label{
    font-family:"Shippori Mincho", serif;
    font-size:32px; letter-spacing:0.42em; color:#8a7a66; text-indent:0.42em; margin-bottom:52px;
  }
  .head{
    font-size:62px; font-weight:600; color:#8f3a2c; letter-spacing:0.07em; line-height:1.55; margin:0;
  }
  .rule{ width:200px; height:1px; background:rgba(150,128,100,0.45); margin:84px auto; }
  .body{
    font-size:43px; color:#4a3f36; letter-spacing:0.05em; line-height:1.95; margin:0;
  }
  .body .hl{
    background-image: linear-gradient(to bottom, transparent 24%, rgba(238,199,96,0.5) 24%, rgba(238,199,96,0.5) 78%, transparent 78%);
    padding: 0 6px;
  }
  .foot{
    margin-top:92px; font-family:"Shippori Mincho", serif;
    font-size:50px; letter-spacing:0.2em; color:#7a2f23; text-indent:0.2em;
  }
  .seal{
    position:absolute; right:24px; bottom:-34px;
    width:112px; height:112px; border-radius:50%;
    border:3px solid rgba(168,52,40,0.8);
    box-shadow: inset 0 0 0 8px #fdfaf3, inset 0 0 0 13px rgba(168,52,40,0.5);
    color:rgba(168,52,40,0.92); font-family:"Shippori Mincho", serif; font-size:50px;
    display:flex; align-items:center; justify-content:center;
    transform: rotate(-7deg);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="orn">
      <svg viewBox="0 0 104 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 6h38" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M64 6h38" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M52 1.4c2.6 1.6 2.6 7.6 0 9.2-2.6-1.6-2.6-7.6 0-9.2Z" stroke="currentColor" stroke-width="1.4"/>
        <path d="M52 2.6v6.8" stroke="currentColor" stroke-width="1"/>
      </svg>
    </div>

    <div class="inner">
      <div class="label">占い師のバナナ君より</div>

      <p class="head">今年の年末をもって、<br>活動を一旦休止します。</p>

      <div class="rule"></div>

      <p class="body">年末までは、<br><span class="hl">個別鑑定を受け付けています。</span></p>

      <div class="foot">年末まで、残り僅か。</div>
    </div>

    <div class="seal">承</div>
  </div>
</body>
</html>
